# Auto-generated by main.sh (api endpoint) — edit deploy.conf (domain_*) and re-run webconf
server {
    listen 80;
    server_name @DOMAIN@;
    client_max_body_size @CLIENT_MAX_BODY@;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://@API_ADDR@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # media served same-origin under /media when no media domain is set (harmless otherwise).
    # NOTE: no try_files here — with `alias` nginx resolves try_files against $root, which the
    # api server block does not define, so every media request would 404.
    location /media/ {
        alias @MEDIA_DIR@/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
