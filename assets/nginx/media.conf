# Auto-generated by main.sh (media endpoint) — edit deploy.conf (domain_*) and re-run webconf
server {
    listen 80;
    server_name @DOMAIN@;
    root @MEDIA_DIR@;

    # Uploads are served from their own origin: a sniffed HTML/SVG payload must
    # never be allowed to run as a document.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
