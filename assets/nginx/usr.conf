# Auto-generated by main.sh (usr endpoint) — edit deploy.conf (domain_*) and re-run webconf
server {
    listen 80;
    server_name @DOMAIN@;
    root @USR_DIR@;
    index index.html;
    client_max_body_size @CLIENT_MAX_BODY@;

    # Baseline hardening. The CSP is the set this SPA needs: Nuxt's inline
    # config scripts, blob: previews, and the Telegram login widget frame.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; connect-src 'self' https:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://oauth.telegram.org https://telegram.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # hashed build assets can be cached forever
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every backend surface on this host: with NUXT_PUBLIC_API_BASE=same-origin
    # the frontend posts here, and the auth cookie lives under /usr/api/v1/auth.
    # Harmless when domain_api is set (the SDK then calls that origin directly).
    location ~ ^/(api|usr|adm)/ {
        proxy_pass http://@API_ADDR@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # media with no media domain: resources.media-url is empty, so media URLs are
    # relative (/media/...) and the site itself has to serve them.
    location /media/ {
        alias @MEDIA_DIR@/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
