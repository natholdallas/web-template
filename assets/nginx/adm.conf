# Auto-generated by main.sh (adm endpoint) — edit main.sh domains[] and re-run webconf
server {
    listen 80;
    server_name @DOMAIN@;
    root @ADM_DIR@;
    index index.html;

    # hashed build assets can be cached forever
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}