# media.xxxx.com — static file server for the media storage dir.
#
# Serve the media files directly from disk under a dedicated domain (not a
# reverse proxy). Point `resources.media-url` in conf.toml to
# `https://media.xxxx.com` so the backend advertises this origin; the API keeps
# serving /media as well for dev/intranet use.
#
# Usage (adjust root to the actual `resources.media` path on the server):
server {
  listen 443 ssl;
  server_name media.xxxx.com;

  # ssl_certificate     /etc/ssl/media.xxxx.com.crt;
  # ssl_certificate_key /etc/ssl/media.xxxx.com.key;

  root /var/www/webtplmst/media; # = resources.media on the server
  index index.html;

  location / {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}

# If you don't want a separate domain, just add a route in the main server
# block that proxies to this project's backend /media (once `app.nginx=true`
# the backend skips its own static middleware and expects nginx to serve it):
#   location /media/ {
#     root  /var/www/webtplmst;   # parent of resources.media
#     try_files $uri =404;
#   }