# media.xxxx.com — static file server for the media storage dir.
#
# Serve the media files directly from disk under a dedicated domain (not a
# reverse proxy). Point `resources.media-url` in conf.toml to
# `https://media.xxxx.com` so the backend advertises this origin; the API keeps
# serving /media as well for dev/intranet use.
#
# Usage: copy into /etc/nginx/conf.d/ (adjust server_name and root), then
# `nginx -t && systemctl reload nginx`. The block ships plain-HTTP so it passes
# `nginx -t` as-is; terminate TLS in front (certbot) or replace the listen line
# with `listen 443 ssl;` plus the certificate directives below.
server {
  listen 80;
  server_name media.xxxx.com;

  # ssl_certificate     /etc/ssl/media.xxxx.com.crt;
  # ssl_certificate_key /etc/ssl/media.xxxx.com.key;

  root /var/www/webgx/media; # = resources.media on the server
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}

# If you don't want a separate domain, just add a route in the main server
# block that serves this project's media (once `app.nginx=true` the backend
# skips its own static middleware and expects nginx to serve it):
#   location /media/ {
#     alias /var/www/webgx/media/;
#     try_files $uri =404;
#   }
