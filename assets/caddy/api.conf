# Auto-generated by main.sh (api endpoint) — edit deploy.conf (domain_*) and re-run webconf
@DOMAIN@ {
    request_body {
        max_size @CLIENT_MAX_BODY_CADDY@
    }

    header {
        X-Content-Type-Options nosniff
        X-Frame-Options DENY
        Referrer-Policy no-referrer
        Permissions-Policy "camera=(), microphone=(), geolocation=()"
    }

    reverse_proxy @API_ADDR@

    # media served same-origin under /media when no media domain is set (harmless otherwise)
    handle_path /media/* {
        root * @MEDIA_DIR@
        file_server
    }
}
