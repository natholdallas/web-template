# Auto-generated by main.sh (media endpoint) — edit deploy.conf (domain_*) and re-run webconf
@DOMAIN@ {
    root * @MEDIA_DIR@
    encode gzip zstd

    # Uploads are served from their own origin: a sniffed HTML/SVG payload must
    # never be allowed to run as a document.
    header {
        X-Content-Type-Options nosniff
        X-Frame-Options DENY
        Referrer-Policy no-referrer
        Permissions-Policy "camera=(), microphone=(), geolocation=()"
        Cache-Control "public, max-age=2592000, immutable"
    }

    file_server
}
