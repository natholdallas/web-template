# Auto-generated by main.sh (adm endpoint) — edit deploy.conf (domain_*) and re-run webconf
@DOMAIN@ {
    encode gzip zstd

    # Upload limit mirrors conf.toml [app] body-limit (Caddy needs a byte unit).
    request_body {
        max_size @CLIENT_MAX_BODY_CADDY@
    }

    # Baseline hardening. The CSP is the set this SPA needs: Nuxt's inline
    # config scripts and blob: previews. No third-party scripts are loaded.
    header {
        X-Content-Type-Options nosniff
        X-Frame-Options DENY
        Referrer-Policy no-referrer
        Permissions-Policy "camera=(), microphone=(), geolocation=()"
        Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; connect-src 'self' https:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://oauth.telegram.org https://telegram.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    }

    # Owning hashed build assets: 1 year, immutable.
    @static path /_nuxt/*
    header @static Cache-Control "public, max-age=31536000, immutable"

    # Every backend surface on this host (same-origin API base). Handles are
    # mutually exclusive and evaluated in file order, so these must stay before
    # the SPA fallback block at the end.
    handle /api/* {
        reverse_proxy @API_ADDR@
    }
    handle /usr/* {
        reverse_proxy @API_ADDR@
    }
    handle /adm/* {
        reverse_proxy @API_ADDR@
    }

    # media with no media domain: resources.media-url is empty, so media URLs are
    # relative (/media/...). handle_path strips the prefix, matching the nginx
    # `alias` behaviour.
    handle_path /media/* {
        root * @MEDIA_DIR@
        file_server
    }

    handle {
        root * @ADM_DIR@
        try_files {path} /index.html
        file_server
    }
}
