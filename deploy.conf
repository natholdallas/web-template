# shellcheck shell=bash
# shellcheck disable=SC2034
# deploy.conf — main.sh deploy configuration (bash syntax; data lives here, logic stays in main.sh)
# pname: lowercase letters/digits/underscore/hyphen; used as the systemd unit, tmux session and remote dir name.
pname=webgx
deploy_mode=systemctl          # systemctl | tmux
web_server=none                # none | nginx | caddy
use_rsync=true                 # true=rsync, false=scp (env USE_RSYNC wins)

# apps: name|dir|build_cmd|out_dir (name is also the site endpoint: usr / adm)
apps=(
  "adm|web/apps/adm|pnpm generate|dist"
  "usr|web/apps/usr|pnpm generate|dist"
)

# servers: name|ssh_user|host (first entry is default; deploy ships to every entry in order)
servers=(
  "prod|deploy-user|127.0.0.1"
)

# Endpoint domains: bare hostname[:port] only; empty = disabled; no https:// or path.
# Every app in apps[] is a site endpoint (gets domain_<app> automatically);
# api (backend) and media are built-in endpoints.
#   e.g. domain_usr="example.com"   domain_api="api.example.com"
domain_usr=""    # user site, e.g. example.com
domain_adm=""    # admin site, e.g. admin.example.com
domain_api=""    # backend API, e.g. api.example.com
domain_media=""  # media site, e.g. media.example.com; empty = frontend uses relative /media/...

# Per-server/per-app build-time env overrides: server:app:VAR (explicit values beat auto-derived ones)
declare -A app_env
# app_env[prod:adm:NUXT_PUBLIC_API_BASE]=https://api.example.com
