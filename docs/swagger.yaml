info:
  contact: {}
  description: API Documentation
  title: webtplmst
  version: "1.0"
paths:
  /adm/api/v1/admin:
    get:
      consumes:
      - application/json
      operationId: admListAdmins
      parameters:
      - in: query
        name: column
        type: string
      - in: query
        name: desc
        type: boolean
      - in: query
        name: page
        type: integer
      - in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdmAdminsPage'
      security:
      - ApiKeyAuth: []
      summary: List Admins
      tags:
      - admAdmin
    post:
      consumes:
      - application/json
      operationId: admCreateAdmin
      parameters:
      - description: Admin object
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/AdmAdminIn'
