version: "2"

# 1. Linters corresponding to gopls analyses / staticcheck
linters:
  default: none
  enable:
    - govet # Corresponds to shadow, unreachable, nilness, fieldalignment, etc.
    - staticcheck # Corresponds to gopls staticcheck = true and ST1003
    - unused # Corresponds to unusedparams / unusedwrite detections
    - revive # Corresponds to useany and coding standard rules
    - misspell # Additional spell checking
  settings:
    revive:
      rules:
        - name: use-any

# 2. Detailed configuration corresponding to gopls analysis rules
linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment # Corresponds to gopls fieldalignment = false

  revive:
    rules:
      - name: use-any # Corresponds to gopls analyses useany = true
      - name: var-naming # Corresponds to ST1003 (naming conventions for variables/exported identifiers)

  staticcheck:
    checks:
      - "all"
      - "ST1003" # Explicitly specify style check ST1003

# 3. Formatting configuration corresponding to gopls gofumpt = true
formatters:
  enable:
    - gofumpt # Enable gofumpt formatting
    - gci # Used alongside gci to replicate gopls automatic multi-group import sorting
  settings:
    gci:
      sections:
        - standard
        - default
